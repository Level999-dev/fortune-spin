<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortune Spin — Scatter Edition</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-card: #111827;
      --gold: #fbbf24;
      --gold-glow: rgba(251, 191, 36, 0.45);
      --text: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #172554 0%, var(--bg-dark) 72%);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px;
    }

    .hud {
      display: flex;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .pill {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .pill span { color: var(--gold); }

    canvas {
      border-radius: 20px;
      background: rgba(17, 24, 39, 0.55);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      touch-action: manipulation;
    }

    #banner {
      position: fixed;
      top: 12%;
      left: 50%;
      transform: translate(-50%, -20px) scale(0.9);
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-weight: 900;
      font-size: 18px;
      padding: 10px 22px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 10;
      white-space: nowrap;
    }

    #banner.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    #spinBtn {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(180deg, #fcd34d, #f59e0b);
      color: #090d16;
      box-shadow: 0 8px 24px var(--gold-glow);
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    #spinBtn:active { transform: scale(0.96); }
    #spinBtn:disabled { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="banner">SCATTER BURST! +250 BONUS</div>

  <div class="stage">
    <div class="hud">
      <div class="pill">SCORE: <span id="scoreVal">0</span></div>
      <div class="pill">SCATTERS: <span id="scatterVal">0</span></div>
    </div>

    <canvas id="game"></canvas>
    <button id="spinBtn">SPIN &amp; SCATTER</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const banner = document.getElementById("banner");
    const scoreEl = document.getElementById("scoreVal");
    const scatterEl = document.getElementById("scatterVal");

    const size = Math.min(window.innerWidth - 24, 380);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = `${size}px`;
    canvas.style.height = `${size}px`;
    ctx.scale(dpr, dpr);

    const cx = size / 2;
    const cy = size / 2;
    const radius = size * 0.36;

    const slices = [
      { label: "SCATTER", pts: 250, color: "#e11d48", isScatter: true },
      { label: "100",     pts: 100, color: "#2563eb", isScatter: false },
      { label: "BONUS",   pts: 200, color: "#059669", isScatter: true },
      { label: "50",      pts: 50,  color: "#d97706", isScatter: false },
      { label: "SCATTER", pts: 250, color: "#7c3aed", isScatter: true },
      { label: "500",     pts: 500, color: "#db2777", isScatter: false }
    ];

    const scatterPalette = ["#fde047", "#38bdf8", "#fb7185", "#34d399", "#c084fc"];
    const shapes = ["star", "diamond", "orb"];

    let angle = 0;
    let angularVel = 0;
    let spinning = false;
    let score = 0;
    let scatterCount = 0;
    let screenShake = 0;
    let bannerTimer = null;

    // Scatter particles & shockwaves
    let scatterItems = [];
    let shockwaves = [];

    function showBanner(text) {
      banner.textContent = text;
      banner.classList.add("show");
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => banner.classList.remove("show"), 1800);
    }

    function triggerScatter(originX, originY, intense = false) {
      const count = intense ? 75 : 32;
      screenShake = intense ? 11 : 4;

      shockwaves.push({
        x: originX,
        y: originY,
        r: 12,
        maxR: intense ? radius * 1.45 : radius * 0.9,
        alpha: 0.85,
        color: intense ? "#fbbf24" : "#38bdf8"
      });

      for (let i = 0; i < count; i++) {
        const theta = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
        const speed = intense ? 3.5 + Math.random() * 7.5 : 2 + Math.random() * 4.5;
        scatterItems.push({
          x: originX,
          y: originY,
          vx: Math.cos(theta) * speed,
          vy: Math.sin(theta) * speed - (intense ? 2.2 : 1.0),
          drag: 0.975,
          gravity: 0.14,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.28,
          scale: (intense ? 0.85 : 0.6) + Math.random() * 0.75,
          color: scatterPalette[i % scatterPalette.length],
          shape: shapes[i % shapes.length],
          life: 1,
          decay: 0.011 + Math.random() * 0.01
        });
      }
    }

    function drawShape(item) {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.rot);
      ctx.scale(item.scale, item.scale);
      ctx.globalAlpha = Math.max(0, item.life);
      ctx.fillStyle = item.color;
      ctx.shadowColor = item.color;
      ctx.shadowBlur = 10;

      if (item.shape === "diamond") {
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(7, 0);
        ctx.lineTo(0, 10);
        ctx.lineTo(-7, 0);
        ctx.closePath();
        ctx.fill();
      } else if (item.shape === "star") {
        ctx.beginPath();
        for (let p = 0; p < 10; p++) {
          const rad = p % 2 === 0 ? 10 : 4.5;
          const a = (p * Math.PI) / 5 - Math.PI / 2;
          const px = Math.cos(a) * rad;
          const py = Math.sin(a) * rad;
          if (p === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function getWinningSlice() {
      // Top pointer is at -PI/2 (or 3*PI/2)
      const pointerAngle = (Math.PI * 1.5 - angle) % (Math.PI * 2);
      const normalized = (pointerAngle + Math.PI * 2) % (Math.PI * 2);
      const arc = (Math.PI * 2) / slices.length;
      const idx = Math.floor(normalized / arc) % slices.length;
      return slices[idx];
    }

    function evaluateLanding() {
      const hit = getWinningSlice();
      score += hit.pts;
      scoreEl.textContent = score;

      if (hit.isScatter) {
        scatterCount += 1;
        scatterEl.textContent = scatterCount;
        triggerScatter(cx, cy, true);
        showBanner(`${hit.label} BURST! +${hit.pts} PTS`);
      } else {
        triggerScatter(cx, cy - radius * 0.45, false);
        showBanner(`LANDED ON ${hit.label} (+${hit.pts})`);
      }
    }

    function drawWheel() {
      const arc = (Math.PI * 2) / slices.length;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      slices.forEach((slice, i) => {
        const start = i * arc;
        const end = start + arc;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = slice.color;
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255,255,255,0.22)";
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + arc / 2);
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 13px system-ui, sans-serif";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 4;
        ctx.fillText(slice.label, radius - 14, 0);
        ctx.restore();
      });

      // Center hub
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fillStyle = "#0f172a";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#fbbf24";
      ctx.stroke();

      ctx.restore();

      // Top indicator arrow
      ctx.save();
      ctx.fillStyle = "#fbbf24";
      ctx.shadowColor = "rgba(0,0,0,0.6)";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(cx, cy - radius + 12);
      ctx.lineTo(cx - 13, cy - radius - 14);
      ctx.lineTo(cx + 13, cy - radius - 14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function updateAndDrawEffects() {
      // Shockwaves
      shockwaves.forEach(w => {
        w.r += (w.maxR - w.r) * 0.12;
        w.alpha *= 0.92;
        ctx.save();
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
        ctx.strokeStyle = w.color;
        ctx.globalAlpha = Math.max(0, w.alpha);
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      });
      shockwaves = shockwaves.filter(w => w.alpha > 0.03);

      // Scatter symbols
      scatterItems.forEach(item => {
        item.vx *= item.drag;
        item.vy = item.vy * item.drag + item.gravity;
        item.x += item.vx;
        item.y += item.vy;
        item.rot += item.vRot;
        item.life -= item.decay;
        drawShape(item);
      });
      scatterItems = scatterItems.filter(item => item.life > 0);
    }

    function loop() {
      ctx.clearRect(0, 0, size, size);

      ctx.save();
      if (screenShake > 0.2) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
        screenShake *= 0.86;
      } else {
        screenShake = 0;
      }

      drawWheel();
      updateAndDrawEffects();
      ctx.restore();

      if (spinning) {
        angle = (angle + angularVel) % (Math.PI * 2);
        angularVel *= 0.986;

        if (angularVel < 0.0035) {
          spinning = false;
          angularVel = 0;
          spinBtn.disabled = false;
          evaluateLanding();
        }
      }

      requestAnimationFrame(loop);
    }

    spinBtn.addEventListener("click", () => {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      angularVel = 0.34 + Math.random() * 0.18;
    });

    loop();
  </script>
</body>
</html>
